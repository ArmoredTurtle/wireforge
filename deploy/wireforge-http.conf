<VirtualHost *:80>
    ServerName wireforge.armoredturtle.com
    DocumentRoot /var/www/wireforge.armoredturtle.com/current

    <Directory /var/www/wireforge.armoredturtle.com/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wireforge-error.log
    CustomLog ${APACHE_LOG_DIR}/wireforge-access.log combined
</VirtualHost>
