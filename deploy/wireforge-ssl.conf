<VirtualHost *:80>
    ServerName wireforge.armoredturtle.com
    Redirect permanent / https://wireforge.armoredturtle.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName wireforge.armoredturtle.com
    DocumentRoot /var/www/wireforge.armoredturtle.com/current

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wireforge.armoredturtle.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wireforge.armoredturtle.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteRule ^ - [R=405,L]

    <Directory /var/www/wireforge.armoredturtle.com/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Header always unset X-Powered-By

    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <Location "/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/wireforge-error.log
    CustomLog ${APACHE_LOG_DIR}/wireforge-access.log combined
</VirtualHost>
